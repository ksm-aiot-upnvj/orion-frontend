server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Redirect /orion → /orion/ (pakai $http_host agar port ikut)
    location = /orion {
        return 301 $scheme://$http_host/orion/;
    }

    # 2. Redirect URL clean tanpa trailing slash → dengan trailing slash
    location ~ ^/orion/([^.]*[^/])$ {
        return 301 $scheme://$http_host/orion/$1/;
    }

    # 3. Serve file dari /orion/
    location ^~ /orion/ {
        rewrite ^/orion/(.*)$ /$1 break;
        rewrite ^/(.*)/$ /$1 break;
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 4. Fallback MPA
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 5. Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}