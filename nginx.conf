server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Mount the compiled Vite app under the public /orion/ prefix.
    # The dist directory itself is copied to the nginx document root.
    location ^~ /orion/ {
        rewrite ^/orion/(.*)$ /$1 break;
        try_files $uri $uri/ $uri.html =404;
    }

    # Handle Multi-Page Application (MPA) routing & clean URLs
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}