server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # /orion -> /orion/
    location = /orion {
        return 301 $scheme://$http_host/orion/$is_args$args;
    }

    # Legacy:
    # /orion/pages/profile
    # /orion/pages/profile.html
    # /orion/pages/profile/
    # -> /orion/profile
    location ~ ^/orion/pages/([a-z-]+?)(\.html)?/?$ {
        return 301 $scheme://$http_host/orion/$1$is_args$args;
    }

    # /orion/profile/ -> /orion/profile
    location ~ ^/orion/([a-z-]+)/$ {
        return 301 $scheme://$http_host/orion/$1$is_args$args;
    }

    # Clean MPA URLs
    # /orion/profile -> /pages/profile.html
    location ~ ^/orion/(registration|profile|selection|members|inventory|finance|archive|log)$ {
        rewrite ^/orion/(.*)$ /pages/$1.html break;
        try_files $uri =404;
    }

    # /orion/assets/* -> /assets/*
    location ^~ /orion/assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        rewrite ^/orion/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # Everything else under /orion/
    # /orion/ -> /index.html
    # /orion/foo.png -> /foo.png
    location /orion/ {
        rewrite ^/orion/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html =404;
    }

    # Normal root access
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}