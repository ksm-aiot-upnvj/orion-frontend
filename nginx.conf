server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Repeated in every location that uses add_header,
    # because nginx drops inherited add_header directives in such locations.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # 1. App root: /orion -> /orion/ (the only URL with a trailing slash; it is the Vite base path)
    location = /orion {
        return 301 $scheme://$http_host/orion/$is_args$args;
    }

    # 2. Legacy page URLs /orion/pages/<name>[.html][/] -> clean /orion/<name>
    location ~ ^/orion/pages/([a-z-]+?)(\.html)?/?$ {
        return 301 $scheme://$http_host/orion/$1$is_args$args;
    }

    # 3. Clean page URLs never end with a slash: /orion/<name>/ -> /orion/<name>
    location ~ ^/orion/([a-z-]+)/$ {
        return 301 $scheme://$http_host/orion/$1$is_args$args;
    }

    # 4. Clean page URLs -> built MPA page
    location ~ ^/orion/(registration|profile|selection|members|inventory|finance|archive|log)$ {
        try_files /pages/$1.html =404;
    }

    # 5. Hashed build assets: long cache
    location ^~ /orion/assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        rewrite ^/orion/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # 6. Home page and public files (logos, images) under the /orion/ base path.
    #    Plain prefix (not ^~) so the regex page routes above are evaluated first.
    location /orion/ {
        rewrite ^/orion/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    # 7. Fallback MPA outside the base path (unchanged)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}
